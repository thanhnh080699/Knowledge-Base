<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100">
  <defs>
    <style>
      .bg { fill: #f4f6f0; }
      .badge { font-family: system-ui, -apple-system, sans-serif; font-size: 20px; font-weight: 700; fill: #327e80; letter-spacing: 1.5px; }
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 38px; font-weight: 800; fill: #14363b; }
      .subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 21px; font-weight: 400; fill: #526a6c; }
      .footer { font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-style: italic; fill: #526a6c; }
    </style>
  </defs>

  <rect width="1600" height="1100" class="bg" />

  <text x="70" y="70" class="badge">HELP DESK / SƠ ĐỒ CHẨN ĐOÁN</text>
  <text x="70" y="125" class="title">Quy trình xử lý sự cố kỹ thuật</text>
  <text x="70" y="170" class="subtitle">Thực hiện tuần tự từ bước 1 đến bước 4 để khoanh vùng nguyên nhân gốc rễ.</text>

  <!-- Step 1 -->
  <g class="step" id="step-1">
    <rect x="70" y="240" width="740" height="140" rx="18" fill="#ffffff" stroke="#8aafb0" stroke-width="2.5" />
    <circle cx="115" cy="290" r="24" fill="#216c71" />
    <text x="115" y="298" font-family="system-ui, sans-serif" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
    <text x="160" y="290" font-family="system-ui, sans-serif" font-size="20" font-weight="600" fill="#14363b">Kiểm tra kết nối vật lý và đèn trạng thái thiết bị</text>
    <line x1="810" y1="310" x2="1020" y2="310" stroke="#327e80" stroke-width="4" />
    <polygon points="1016,302 1016,318 1028,310" fill="#327e80" />
    <text x="915" y="290" font-family="system-ui, sans-serif" font-size="16" fill="#446164" text-anchor="middle">Đèn báo lỗi đỏ/cam</text>
    <rect x="1030" y="240" width="500" height="140" rx="18" fill="#e0eeea" stroke="#b2cfc8" stroke-width="2" />
    <text x="1055" y="290" font-family="system-ui, sans-serif" font-size="19" fill="#14363b">Xử lý kẹt giấy, nạp mực hoặc cắm lại cáp nguồn</text>
  </g>

  <!-- Step 2 -->
  <g class="step" id="step-2">
    <rect x="70" y="420" width="740" height="140" rx="18" fill="#ffffff" stroke="#8aafb0" stroke-width="2.5" />
    <circle cx="115" cy="470" r="24" fill="#216c71" />
    <text x="115" y="478" font-family="system-ui, sans-serif" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
    <text x="160" y="470" font-family="system-ui, sans-serif" font-size="20" font-weight="600" fill="#14363b">Kiểm tra địa chỉ IP và kết nối mạng nội bộ</text>
    <line x1="810" y1="490" x2="1020" y2="490" stroke="#327e80" stroke-width="4" />
    <polygon points="1016,482 1016,498 1028,490" fill="#327e80" />
    <text x="915" y="470" font-family="system-ui, sans-serif" font-size="16" fill="#446164" text-anchor="middle">Không phản hồi ping</text>
    <rect x="1030" y="420" width="500" height="140" rx="18" fill="#e0eeea" stroke="#b2cfc8" stroke-width="2" />
    <text x="1055" y="470" font-family="system-ui, sans-serif" font-size="19" fill="#14363b">Kiểm tra dây LAN, WiFi và cấp phát DHCP</text>
  </g>

  <!-- Step 3 -->
  <g class="step" id="step-3">
    <rect x="70" y="600" width="740" height="140" rx="18" fill="#ffffff" stroke="#8aafb0" stroke-width="2.5" />
    <circle cx="115" cy="650" r="24" fill="#216c71" />
    <text x="115" y="658" font-family="system-ui, sans-serif" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
    <text x="160" y="650" font-family="system-ui, sans-serif" font-size="20" font-weight="600" fill="#14363b">Khởi động lại dịch vụ hệ thống và dọn hàng đợi</text>
    <line x1="810" y1="670" x2="1020" y2="670" stroke="#327e80" stroke-width="4" />
    <polygon points="1016,662 1016,678 1028,670" fill="#327e80" />
    <text x="915" y="650" font-family="system-ui, sans-serif" font-size="16" fill="#446164" text-anchor="middle">Hàng đợi bị nghẽn</text>
    <rect x="1030" y="600" width="500" height="140" rx="18" fill="#e0eeea" stroke="#b2cfc8" stroke-width="2" />
    <text x="1055" y="670" font-family="system-ui, sans-serif" font-size="19" fill="#14363b">Restart service spooler sau khi dọn sạch file đệm</text>
  </g>

  <!-- Step 4 -->
  <g class="step" id="step-4">
    <rect x="70" y="780" width="740" height="140" rx="18" fill="#ffffff" stroke="#8aafb0" stroke-width="2.5" />
    <circle cx="115" cy="830" r="24" fill="#216c71" />
    <text x="115" y="838" font-family="system-ui, sans-serif" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
    <text x="160" y="830" font-family="system-ui, sans-serif" font-size="20" font-weight="600" fill="#14363b">Cài đặt lại Driver chính thức từ nhà sản xuất</text>
    <line x1="810" y1="850" x2="1020" y2="850" stroke="#327e80" stroke-width="4" />
    <polygon points="1016,842 1016,858 1028,850" fill="#327e80" />
    <text x="915" y="830" font-family="system-ui, sans-serif" font-size="16" fill="#446164" text-anchor="middle">Vẫn báo Offline</text>
    <rect x="1030" y="780" width="500" height="140" rx="18" fill="#e0eeea" stroke="#b2cfc8" stroke-width="2" />
    <text x="1055" y="850" font-family="system-ui, sans-serif" font-size="19" fill="#14363b">Chuyển IT cấp 2 kiểm tra Print Server hoặc phần cứng</text>
  </g>

  <!-- Footer -->
  <rect x="70" y="970" width="1460" height="60" rx="12" fill="#ffffff" stroke="#c0d4cc" stroke-width="1.5" />
  <text x="95" y="1006" class="footer">Lưu ý: Xóa hàng đợi in có thể làm mất các lệnh in đang chờ. Thông báo cho người dùng trước khi thực hiện.</text>
</svg>
